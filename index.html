<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Demand Forecasting Platform — Turning a forecasting model into a production system</title>
<meta name="description" content="Taking an inherited Kedro demand-forecasting pipeline on AWS and making it an operable production system: validation, release discipline, runbooks and recovery — a case study by John Carlo Cueva">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0E1B2C;
  --bg-soft: #142539;
  --bg-section: #182B43;
  --surface: #1B304D;
  --surface-elevated: #213A5C;

  --ink: #F5F1E8;
  --ink-muted: #B4BFCF;
  --ink-faded: #7889A0;
  --ink-dim: #4C5D75;

  --rule: rgba(245, 241, 232, 0.1);
  --rule-soft: rgba(245, 241, 232, 0.05);
  --rule-strong: rgba(245, 241, 232, 0.18);

  --accent-900: #4A2010;
  --accent-700: #B85A1E;
  --accent-500: #E87B33;
  --accent-300: #F4A66B;
  --accent-100: #F8D2B0;

  --teal-700: #1E6F6F;
  --teal-500: #2BA39C;
  --teal-300: #6BC7C0;
  --teal-100: #B8E0DC;

  --sage-700: #5C7048;
  --sage-500: #87A56B;
  --sage-300: #B0C497;

  --rose-700: #8E3B3B;
  --rose-500: #C25B5B;
  --rose-300: #E79595;

  --font-display: 'DM Sans', -apple-system, system-ui, sans-serif;
  --font-body: 'DM Sans', -apple-system, system-ui, sans-serif;
  --font-mono: 'DM Mono', 'SF Mono', Menlo, monospace;
  --font-serif: 'Source Serif 4', Georgia, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.55;
  min-height: 100vh;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
  background-size: 48px 48px;
}

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 2rem; }

/* === Header === */
.site-head {
  border-bottom: 1px solid var(--rule);
  padding: 1.125rem 0;
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(14, 27, 44, 0.88);
}
.site-head-row { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
.brand {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: -0.01em;
  color: var(--ink);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
}
.brand::before {
  content: "";
  display: inline-block;
  width: 0.5rem;
  height: 1.125rem;
  background: var(--accent-500);
  border-radius: 1px;
}
.brand span {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--ink-faded);
  font-weight: 400;
  letter-spacing: 0.06em;
  margin-left: 0.5rem;
  text-transform: uppercase;
}
.site-nav { display: flex; gap: 1.75rem; font-size: 0.875rem; align-items: center; }
.site-nav a { color: var(--ink-muted); text-decoration: none; transition: color 0.15s; font-weight: 500; }
.site-nav a:hover { color: var(--accent-300); }

/* === Hero === */
.hero { padding: 6rem 0 3rem; position: relative; }
.kicker {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent-300);
  margin-bottom: 1.75rem;
  display: inline-flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.375rem 0.875rem;
  background: rgba(232, 123, 51, 0.1);
  border-radius: 4px;
  border: 1px solid rgba(232, 123, 51, 0.2);
}
.kicker .dot { width: 0.375rem; height: 0.375rem; background: var(--accent-500); border-radius: 50%; display: inline-block; }
.hero h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.5rem, 5.5vw, 4.5rem);
  line-height: 1.04;
  letter-spacing: -0.035em;
  color: var(--ink);
  max-width: 22ch;
  margin-bottom: 1.75rem;
}
.hero h1 .serif { font-family: var(--font-serif); font-style: italic; font-weight: 500; color: var(--accent-300); }
.hero-lede {
  font-weight: 400;
  font-size: 1.1875rem;
  line-height: 1.6;
  color: var(--ink-muted);
  max-width: 64ch;
  margin-bottom: 2.5rem;
}
.byline {
  display: flex; align-items: center; gap: 1rem;
  padding-top: 1.25rem; border-top: 1px solid var(--rule);
  max-width: 44rem; font-size: 0.875rem; color: var(--ink-muted); flex-wrap: wrap;
}
.byline strong { color: var(--ink); font-weight: 600; }
.byline .sep { color: var(--ink-dim); }
.byline .mono { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--ink-faded); }
.byline .tag {
  font-family: var(--font-mono); font-size: 0.7rem;
  background: rgba(43, 163, 156, 0.12); color: var(--teal-300);
  padding: 0.2rem 0.55rem; border-radius: 3px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.05em;
  border: 1px solid rgba(43, 163, 156, 0.25);
}

/* === Stat band === */
.stat-band {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem;
  margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--rule);
}
@media (max-width: 900px) { .stat-band { grid-template-columns: repeat(2, 1fr); } }
.stat { display: flex; flex-direction: column; gap: 0.375rem; }
.stat-number {
  font-family: var(--font-display); font-weight: 600; font-size: 2rem;
  letter-spacing: -0.025em; color: var(--accent-300); line-height: 1;
}
.stat-label {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--ink-faded); font-weight: 500;
}

/* === Section === */
section { padding: 3.5rem 0; }
.section-label {
  display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2rem;
  padding-bottom: 1rem; border-bottom: 1px solid var(--rule); flex-wrap: wrap;
}
.section-num {
  font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em;
  color: var(--accent-500); font-weight: 500; background: rgba(232, 123, 51, 0.1);
  padding: 0.2rem 0.55rem; border-radius: 3px; border: 1px solid rgba(232, 123, 51, 0.2);
}
.section-title {
  font-family: var(--font-display); font-weight: 600; font-size: 1.875rem;
  letter-spacing: -0.025em; color: var(--ink);
}
.section-sub {
  font-family: var(--font-mono); font-weight: 400; color: var(--ink-faded);
  margin-left: auto; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.06em;
}
.section-intro { font-size: 1rem; line-height: 1.65; color: var(--ink-muted); max-width: 72ch; margin-bottom: 1.75rem; }
.section-intro code { font-family: var(--font-mono); font-size: 0.85em; background: var(--bg-soft); padding: 0.1rem 0.375rem; border-radius: 3px; color: var(--accent-300); border: 1px solid var(--rule); }

/* === Diagram frame === */
.diagram-frame { background: var(--surface); border: 1px solid var(--rule-strong); padding: 2rem; border-radius: 8px; }
.diagram-label {
  font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--ink-faded); margin-bottom: 1.25rem;
  display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
}
.diagram-label .label-title {
  font-family: var(--font-display); font-weight: 500; font-size: 1rem;
  letter-spacing: -0.015em; color: var(--ink); text-transform: none;
}
.hint {
  background: rgba(232, 123, 51, 0.08); border: 1px solid rgba(232, 123, 51, 0.2);
  padding: 0.875rem 1.125rem; border-radius: 6px; margin-bottom: 1.5rem;
  font-size: 0.875rem; color: var(--ink-muted);
  display: flex; align-items: center; gap: 0.875rem; flex-wrap: wrap;
}
.hint strong {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--accent-300); font-weight: 500;
  padding: 0.2rem 0.55rem; background: rgba(232, 123, 51, 0.15);
  border-radius: 3px; border: 1px solid rgba(232, 123, 51, 0.25); flex-shrink: 0;
}
.svg-wrap { width: 100%; display: flex; justify-content: center; overflow-x: auto; }
.svg-wrap svg { max-width: 100%; height: auto; min-width: 760px; }

.svg-th { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: -0.01em; }
.svg-ts { font-family: var(--font-body); font-size: 10.5px; font-weight: 400; }
.svg-tag { font-family: var(--font-mono); font-size: 8.5px; font-weight: 500; letter-spacing: 0.08em; }
.svg-arr { stroke: var(--ink-faded); stroke-width: 1.25; fill: none; }
.svg-container { fill: none; stroke: var(--ink-dim); stroke-width: 1; stroke-dasharray: 4 4; }
.svg-container-solid { fill: rgba(43,163,156,0.05); stroke: var(--teal-700); stroke-width: 1; }
.svg-region-label { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-faded); letter-spacing: 0.08em; font-weight: 500; }
.svg-edge-label { font-family: var(--font-mono); font-size: 9px; fill: var(--ink-faded); letter-spacing: 0.04em; }

.node-group { cursor: pointer; transition: filter 0.15s ease; }
.node-group:hover { filter: brightness(1.14); }
.node-group:hover rect.nbox { stroke-width: 2; }
.node-static { cursor: default; }

/* === Legend === */
.legend { display: flex; gap: 0.625rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.lg {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.07em; padding: 0.25rem 0.625rem; border-radius: 3px; font-weight: 500;
}
.lg.new { background: rgba(43,163,156,0.12); color: var(--teal-300); border: 1px solid rgba(43,163,156,0.3); }
.lg.mod { background: rgba(232,123,51,0.12); color: var(--accent-300); border: 1px solid rgba(232,123,51,0.3); }
.lg.unc { background: var(--bg-section); color: var(--ink-faded); border: 1px solid var(--rule); }

/* === Pipeline === */
.pipeline { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; }
.pipeline-step {
  display: grid; grid-template-columns: auto 1fr; gap: 1.75rem;
  padding: 1.5rem 1.75rem; border-bottom: 1px solid var(--rule);
  align-items: start; transition: background 0.15s;
}
.pipeline-step:last-child { border-bottom: none; }
.pipeline-step:hover { background: var(--surface-elevated); }
.pipeline-num {
  font-family: var(--font-mono); font-weight: 500; font-size: 0.875rem;
  color: var(--accent-300); background: rgba(232, 123, 51, 0.1);
  padding: 0.625rem 0.875rem; border-radius: 6px;
  border: 1px solid rgba(232, 123, 51, 0.25); height: fit-content;
  min-width: 3.25rem; text-align: center;
}
.pipeline-step.is-new .pipeline-num { color: var(--teal-300); background: rgba(43,163,156,0.1); border-color: rgba(43,163,156,0.3); }
.pipeline-body { display: flex; flex-direction: column; gap: 0.5rem; }
.pipeline-title { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; letter-spacing: -0.015em; color: var(--ink); }
.pipeline-tech { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-300); font-weight: 500; }
.pipeline-step.is-new .pipeline-tech { color: var(--teal-300); }
.pipeline-desc { font-size: 0.9375rem; color: var(--ink-muted); line-height: 1.6; max-width: 72ch; margin-top: 0.125rem; }
.pipeline-desc code, .pipeline-note code { font-family: var(--font-mono); font-size: 0.85em; background: var(--bg-soft); padding: 0.1rem 0.375rem; border-radius: 3px; color: var(--accent-300); border: 1px solid var(--rule); }
.pipeline-desc strong { color: var(--ink); font-weight: 600; }
.pipeline-note { font-size: 0.875rem; color: var(--ink-faded); line-height: 1.6; max-width: 72ch; }

/* === Checks grid === */
.checks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0.75rem; }
.check-card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  padding: 1.125rem 1.25rem 1.25rem; display: flex; gap: 0.875rem;
  align-items: flex-start; transition: all 0.16s;
}
.check-card:hover { background: var(--surface-elevated); border-color: var(--rule-strong); transform: translateY(-1px); }
.check-card.out { border-left: 3px solid var(--teal-700); }
.ck-num { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--accent-300); font-weight: 500; flex: none; padding-top: 0.0625rem; }
.check-card.out .ck-num { color: var(--teal-300); }
.ck-body { flex: 1; min-width: 0; }
.ck-title { font-family: var(--font-display); font-weight: 600; font-size: 0.9375rem; color: var(--ink); letter-spacing: -0.012em; line-height: 1.3; }
.ck-desc { font-size: 0.8125rem; color: var(--ink-muted); line-height: 1.55; margin-top: 0.3125rem; }
.ck-spec { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faded); margin-top: 0.5rem; }
.ck-spec b { color: var(--accent-300); font-weight: 500; }

/* === Defects === */
.defects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1rem; }
.defect {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  overflow: hidden; display: flex; flex-direction: column; transition: all 0.18s;
}
.defect:hover { border-color: var(--rule-strong); background: var(--surface-elevated); }
.defect-head { padding: 1.25rem 1.5rem 1.125rem; border-bottom: 1px solid var(--rule); background: var(--bg-section); }
.defect-kind {
  font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--accent-300); background: rgba(232,123,51,0.12);
  padding: 0.2rem 0.55rem; border-radius: 3px; border: 1px solid rgba(232,123,51,0.25);
  display: inline-block; font-weight: 500;
}
.defect-title { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; letter-spacing: -0.02em; color: var(--ink); line-height: 1.3; margin: 0.75rem 0 0.4375rem; }
.defect-path { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faded); word-break: break-all; }
.defect-body { padding: 1.375rem 1.5rem 1.5rem; flex: 1; display: flex; flex-direction: column; }
.ba { font-family: var(--font-mono); font-size: 0.7rem; line-height: 1.6; border-radius: 6px; overflow: hidden; margin-bottom: 1rem; border: 1px solid var(--rule); }
.ba div { padding: 0.5rem 0.75rem; white-space: pre-wrap; word-break: break-word; }
.ba .was { background: rgba(194,91,91,0.1); color: var(--rose-300); border-bottom: 1px solid var(--rule); }
.ba .now { background: rgba(43,163,156,0.1); color: var(--teal-300); }
.defect-body p { font-size: 0.875rem; line-height: 1.65; color: var(--ink-muted); margin-bottom: 0.75rem; }
.defect-body p:last-of-type { margin-bottom: 0; }
.defect-body strong { color: var(--ink); font-weight: 600; }
.defect-impact {
  margin-top: auto; padding-top: 0.875rem; border-top: 1px solid var(--rule);
  font-size: 0.8125rem; line-height: 1.6; color: var(--ink-muted);
}
.defect-impact b { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--teal-300); display: block; margin-bottom: 0.3125rem; font-weight: 500; }

/* === Decisions === */
.decisions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
@media (max-width: 860px) { .decisions-grid { grid-template-columns: 1fr; } }
.decision-card { background: var(--surface); border: 1px solid var(--rule); padding: 1.75rem; border-radius: 8px; transition: all 0.18s; }
.decision-card:hover { background: var(--surface-elevated); border-color: var(--rule-strong); }
.decision-q { font-family: var(--font-display); font-weight: 600; font-size: 1.0625rem; letter-spacing: -0.015em; color: var(--accent-300); margin-bottom: 0.75rem; line-height: 1.3; }
.decision-a { font-size: 0.9375rem; line-height: 1.6; color: var(--ink-muted); }
.decision-a strong { color: var(--ink); font-weight: 600; }
.decision-a code { font-family: var(--font-mono); font-size: 0.85em; background: var(--bg-soft); padding: 0.1rem 0.375rem; border-radius: 3px; color: var(--accent-300); border: 1px solid var(--rule); }

/* === Stack / reference table === */
.stack-table { width: 100%; background: var(--surface); border: 1px solid var(--rule-strong); border-collapse: collapse; border-radius: 8px; overflow: hidden; }
.stack-table tr { border-bottom: 1px solid var(--rule); }
.stack-table tr:last-child { border-bottom: none; }
.stack-table tr:hover { background: var(--surface-elevated); }
.stack-table td { padding: 0.875rem 1.5rem; vertical-align: top; }
.stack-table td:first-child {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--ink-faded); width: 30%; font-weight: 500;
}
.stack-table td:nth-child(2) { font-size: 0.9375rem; color: var(--ink-muted); }
.stack-table code { font-family: var(--font-mono); font-size: 0.85em; background: var(--bg-soft); padding: 0.15rem 0.4rem; border-radius: 3px; color: var(--accent-300); border: 1px solid var(--rule); }
.stack-table strong { color: var(--ink); font-weight: 600; }
.tbl-scroll { overflow-x: auto; }

/* === Callouts === */
.callout {
  background: rgba(43,163,156,0.07); border: 1px solid rgba(43,163,156,0.22);
  border-left: 3px solid var(--teal-500); padding: 1.125rem 1.375rem;
  border-radius: 6px; margin-top: 1.5rem; font-size: 0.9375rem;
  line-height: 1.65; color: var(--ink-muted);
}
.callout.warn { background: rgba(232,123,51,0.07); border-color: rgba(232,123,51,0.22); border-left-color: var(--accent-500); }
.callout strong { color: var(--ink); font-weight: 600; }
.callout code { font-family: var(--font-mono); font-size: 0.85em; background: var(--bg-soft); padding: 0.1rem 0.375rem; border-radius: 3px; color: var(--accent-300); border: 1px solid var(--rule); }

/* === About === */
.about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2.5rem; }
@media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; gap: 1.75rem; } }
.about-body p { font-size: 1rem; line-height: 1.7; color: var(--ink-muted); margin-bottom: 1rem; }
.about-body p:last-child { margin-bottom: 0; }
.about-body strong { color: var(--ink); font-weight: 600; }
.about-list { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 1.5rem 1.75rem; }
.about-list h4 { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-300); font-weight: 500; margin-bottom: 1rem; padding-bottom: 0.625rem; border-bottom: 1px solid var(--rule); }
.about-list ul { list-style: none; display: flex; flex-direction: column; gap: 0.625rem; }
.about-list li { font-size: 0.875rem; line-height: 1.55; color: var(--ink-muted); padding-left: 1.25rem; position: relative; }
.about-list li::before { content: "▸"; position: absolute; left: 0; color: var(--accent-500); font-size: 0.75em; top: 0.3em; }
.about-list + .about-list { margin-top: 1rem; }

/* === Modal === */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(6px); }
.modal-backdrop.open { opacity: 1; pointer-events: all; }
.modal-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
  background: var(--bg-soft); z-index: 101; transform: translateX(100%);
  transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.32, 0.96);
  overflow-y: auto; border-left: 1px solid var(--rule-strong);
  display: flex; flex-direction: column; box-shadow: -16px 0 40px rgba(0,0,0,0.4);
}
.modal-panel.open { transform: translateX(0); }
.modal-header { padding: 2rem 2.5rem 1.5rem; border-bottom: 1px solid var(--rule); background: var(--bg-section); position: sticky; top: 0; z-index: 2; }
.modal-close {
  position: absolute; top: 1.5rem; right: 1.5rem; width: 2rem; height: 2rem;
  background: transparent; border: 1px solid var(--rule); color: var(--ink-muted);
  cursor: pointer; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 1rem; transition: all 0.15s; font-family: var(--font-body);
}

const COMPONENTS = {
  repo: {
    name: "Source repository",
    altName: "branch · pull request · review",
    category: "Delivery · version control",
    kind: "dev",
    summary: "The pipeline source, its environment-scoped configuration, and the two workflow definitions that build and deploy it. Enterprise-hosted, with the pull request as the unit of change.",

    talking: [
      "One image per release serves all three environments — environments differ by parameters, not by build",

  build: {
    name: "Build workflow",
    altName: "produces images · deploys nothing",

    role: "Separating build from deploy is the single most load-bearing decision in the delivery model. A workflow that built and shipped in one action would mean every merge reached an environment, and the only control left would be the merge itself. Splitting them means the artefact can exist, be inspected and be promoted deliberately — and it means a branch can be proven in a real environment before it is merged rather than after. The build runs in two to four minutes because it layers onto a pre-baked base image carrying the dependency tree and the compiled statistical toolchain.",
    talking: [
      "Build and deploy as separate workflows — the artefact exists before anyone decides where it goes",
      "Pull-request builds let a branch be tested in a real environment pre-merge, so a failure never has to be reverted out of the main line",
      "Two to four minute builds by layering on a pre-baked base image with dependencies and the compiled toolchain already present",
      "Release images are immutable and commit-tagged; branch images are mutable and move with the branch",
      "Open gap: no test step in this workflow, so the unit suite does not run automatically — raised, not solved"

  ecr: {
    name: "Container registry",
    altName: "immutable releases · mutable branch builds",
    category: "Delivery · artefact store",
    kind: "dev",

    role: "The split exists because the two serve different purposes. A release image must be able to answer 'which code produced this forecast' years later, so it is immutable and commit-tagged and a task-definition revision referencing it is a genuine audit record. A branch image is a convenience for iteration, so its tag moves and a revision referencing it is not an audit record — the same revision can launch different code on different days. That asymmetry is fine as long as it is understood, which is why it is written down rather than discovered.",
    talking: [
      "Immutable release repository means a task-definition revision is a real audit record",
      "Mutable branch tags mean a development revision is not one — the commit must be recorded alongside any result",
      "Cross-account copy into the production registry, so production never pulls from a non-production account",
      "Registry-to-registry copy with no local pull, which keeps the deploy runner stateless"

  },
  promote: {
    name: "Promote workflow",
    altName: "one environment per run · reviewer-gated",
    category: "Delivery · deployment",
    kind: "dev",
    summary: "The only thing that changes what an environment runs. Registers a new task-definition revision pointing at a chosen image, for exactly one environment, behind a required reviewer.",
    role: "Nothing auto-deploys anywhere. Promotion resolves an image from its inputs in a fixed precedence — a named branch build first, then a specific release tag, then the latest release — and refuses a branch build for production outright, so production can only ever run an immutable, commit-tagged image. It can also launch the run itself, which collapses deploy-then-trigger into one gated action. The failure mode it is designed against is the most common one in this class of system: promoting without setting the image input, which silently deploys the previous release and produces a green run that proves nothing.",
    talking: [
      "One environment per run, each behind its own required reviewer — no fan-out deployment",
      "Fixed image-resolution precedence, with branch builds structurally refused for production",
      "Deploy and launch in one gated action rather than two unrelated buttons",
      "Designed against the specific mistake of promoting the wrong image and reading the resulting green run as a pass",

  },
  taskdef: {
    name: "Task definition",
    altName: "revision pins image, resources and secrets",
    category: "Runtime · deployment target",
    kind: "dev",
    summary: "A versioned definition of what to launch: the image, CPU and memory, environment variables, secret references, IAM role and log configuration. Promotion creates a new revision; the schedule targets the family, so the newest active revision is what runs.",
    role: "Because the scheduler targets the family rather than a pinned revision, promotion is the act of deployment — there is no separate release step and no long-running service to update. The revision also carries the storage location for the environment, which matters more than it sounds: the production bucket name differs structurally from the lower environments, and a revision that inherited a default would write to the wrong place and be refused by the encryption key policy rather than silently succeeding.",
    talking: [

    role: "This is where the forecast's quality is actually determined, and for a long time it was the least examined part of the system. The files arrive from several upstream owners with no common contract — different date conventions between files, no declared end date, no row-count expectation. A short file, a partial final month or a value entered at the wrong scale all produce a run that completes successfully and a forecast that is confidently wrong. Three of the files are summed together, so a month present in some and absent in others yields a single null that fails a run an hour later with an unrelated message.",
    talking: [

      "Summed inputs turn a one-month gap into a single null, which is the hardest possible failure to read",

    talking: [

      "Hook system gives cross-cutting concerns a defined execution point rather than an import side effect",

      <ComponentModal nodeId={selected} onClose={onClose} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
